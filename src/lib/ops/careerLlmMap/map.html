<script>
(()=>{
 function start(initialData){
 let DATA=initialData;

 const blocks=mode=>DATA.plans[mode]||DATA.plans.chat,byKey=(mode,key)=>blocks(mode).find(id=>C[id].key===key);let mainId=byKey('chat','career_main');
 const shortTitles={scheduled_work:'예약된 작업 수행 지침',career_main:'career_main · 기본 지침',visible_actions_guide:'홈의 다음 행동 관리',career_chat_display:'채팅 답변 작성',chat_core:'chat_core · 별도 기본 지침',background_execution:'백그라운드 작업 지침',autonomous_career_work:'검색·추천 작업 지침',profile_context:'프로필·이력서',future_matching_insights:'사용자 정보·희망 조건',visible_actions:'홈에 표시된 다음 행동',capability_catalog:'불러올 수 있는 도구 목록',gmail_capability:'Gmail 연결 상태',dynamic_state:'현재 상황·이번 실행 목적',handbook_catalog:'업무 지침 목록',tool_policy:'도구 사용 지침',email_output_contract:'이메일 답변 작성',email_thread_context:'받은 메일·앞선 답장',core_response_guidance:'온보딩 답변 작성',onboarding_rules:'온보딩 진행',post_onboarding_voice_response_guidance:'통화 중 답변 작성',voice_call_rules:'통화 도구·종료 방법',career_coaching_activity:'진행 중인 코칭'};
 const fixedTitles={event:'이번에 일어난 일·맡긴 목적',history:'최근 대화·이전 요약',results:'도구 호출·실제 결과',link:'공고 ID·추천 ID·정확한 링크',tools_core:'기본 도구',loaders:'도구·지침 불러오기',tools_voice:'통화에서 쓸 수 있는 도구',tools_chat:'채팅에서 쓸 수 있는 도구','h:proactive_career':'먼저 챙길 일 판단','p:voice_back':'통화 판단 모델의 지침','p:voice_front':'듣고 말하는 모델의 지침','p:voice_front_onboarding':'온보딩 음성 모델의 지침'};
 const label=id=>fixedTitles[id]||shortTitles[C[id]?.key]||C[id]?.title||id;
 const typeInfo=id=>DATA.inputTypes[C[id]?.inputType]||DATA.inputTypes.mixed;
 function button(id,{included,block=true,tile=false}={}){const c=C[id];if(!c)return '';const type=typeInfo(id);return `<button class="btn${block?' btn-block':''} viz-tile input-fill" type="button" data-input-type="${esc(c.inputType)}" data-component="${esc(id)}" data-tooltip="${esc(type.label+' · '+c.summary)}"${included===undefined?'':` aria-pressed="${included}"`}><span class="input-content"><span>${esc(label(id))}</span><span class="input-kind text-small">${esc(type.label)}</span></span></button>`;}
 function contentKinds(c){return `${c.fixedPart?`<div class="kind-note input-fill" data-input-type="conditional"><h3>고정된 내용</h3><p>${esc(c.fixedPart)}</p></div>`:''}${c.dataPart?`<div class="kind-note input-fill" data-input-type="data"><h3>실행 때 넣는 값</h3><p>${esc(c.dataPart)}</p></div>`:''}`;}

 function show(title,kind,html){el('map-dialog-title').textContent=title;el('map-dialog-kind').textContent=kind;el('map-dialog-content').innerHTML=html;if(!el('map-dialog').open)el('map-dialog').showModal();el('map-dialog').scrollTop=0;}
 function save(){}
 function restore(v){const x=v?.privateContent;if(!x||x.layout!=='desktop-cache-models-v2'||(x.sequence||0)<sequence)return;sequence=x.sequence||0;if(DATA.scenarios.some(s=>s.id===x.scenario))state.scenario=x.scenario;if(['current','proposed'].includes(x.mode))state.mode=x.mode;state.node=current().nodes[x.node]?x.node:current().nodes.findIndex(n=>n.kind==='main');state.stage=['first','loaded','result'].includes(x.stage)?x.stage:'first';state.cacheModel=x.cacheModel==='claude'?'claude':'gpt';}
__CAREER_COMPOSE__
 function token(id){return C[id]?.key||id;}
 // GPT uses a flattened system message with no explicit cache options.
 // Claude preserves explicit system/tool breakpoints. Neither means a hit.
 const cacheExplanations={
  gpt:'Career GPT 경로는 system blocks를 한 문자열로 합치고, prompt_cache_key·prompt_cache_options·prompt_cache_breakpoint를 보내지 않습니다. OpenAI의 기본 implicit 캐시를 사용합니다. 회색은 캐시 후보이며 적중한 범위가 아닙니다. 프로필·Memory 끝에는 별도 경계가 없고, 현재 시각·상태까지 같은 system 메시지에 들어가므로 그것이 바뀌면 앞의 고정 지침만 별도로 재사용된다고 볼 수 없습니다. 대화·도구 결과는 이전의 적격 메시지 끝까지 전체 앞부분이 같아야 재사용할 수 있습니다. 실제 양은 usage의 cached_tokens·cache_write_tokens로 확인합니다.',
  claude:'Claude 네이티브 호출은 프로필 끝·Memory 끝과 도구 정의 끝에 cache_control을 지정합니다. 표시한 경계까지 전체 앞부분이 동일할 때 재사용하며, 실제 적중 여부는 실행 로그로 확인해야 합니다.'
 };
 const cacheExplanation=()=>cacheExplanations[state.cacheModel];
 const cacheSource=()=>state.cacheModel==='gpt'?'src/lib/career/textChatModelConfig.ts; src/lib/career/llm.ts · flattenCareerSystemBlocks; src/lib/talentOnboarding/llm.ts · createTalentChatCompletion; src/lib/llm/responsesChatAdapter.ts · buildOpenAIResponsesRequest':'src/lib/career/llm.ts · buildAnthropicSystemBlocks / buildAnthropicTools; src/lib/career/prompts/promptCaching.ts';
 function cacheLayout(cp){
  const n=active();if(state.mode!=='current'||n?.kind!=='main'||cp.mode?.startsWith('voice'))return {groups:[],ids:new Set(),tools:[]};
  if(state.cacheModel==='gpt'){
   const messages=r=>r.id==='history'||r.id==='results'||r.label?.startsWith('messages');
   const system=cp.rows.filter(r=>r.label==='system');
   const groups=[{ids:system.map(r=>r.id),label:'자동 캐시 후보 · 하나의 system 메시지',hint:'이 안의 고정 지침·프로필·현재 상황을 모두 합쳐 한 메시지로 보냅니다. 내부 항목마다 독립적으로 캐시하는 구조가 아닙니다.'},...cp.rows.filter(messages).map(r=>({ids:[r.id],label:r.id==='results'?'자동 캐시 후보 · 도구 결과 끝':'자동 캐시 후보 · 대화 메시지 끝',hint:'이 행은 여러 메시지를 요약한 표시입니다. 실제 경계는 적격 user 메시지·연속 도구 응답의 마지막 끝입니다. 앞의 system·도구 정의·대화도 같아야 합니다.'}))].filter(g=>g.ids.length);
   return {groups,ids:new Set(groups.flatMap(g=>g.ids)),tools:cp.tools.filter(id=>id!=='loaded_tools')};
  }
  const system=cp.rows.filter(r=>r.label==='system');
  const ends=system.flatMap((r,i)=>(cp.cacheEnds||[]).includes(r.id)?[i]:[]);
  let start=0;const groups=ends.map((end,i)=>{const rows=system.slice(start,end+1);start=end+1;return {ids:rows.map(r=>r.id),label:i===0?'프롬프트 캐시 · 프로필까지':'프롬프트 캐시 · Memory까지',hint:i===0?'도구 정의와 이 구간의 지침·프로필을 앞부분으로 재사용합니다.':'앞의 도구·지침·프로필을 포함해 Memory 끝까지 재사용합니다. Memory가 바뀌어도 앞의 프로필 경계는 재사용할 수 있습니다.'};});
