<script>
(()=>{
 // The ops page rebuilds one real talent's chat input and posts it here.
 let EXAMPLE={status:'idle',email:''},onExample=()=>{};
 window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='career-map:example')return;EXAMPLE=e.data.example||{status:'idle',email:''};onExample();});
 function start(initialData){
 let DATA=initialData;
 const root=document.getElementById('career-llm-map'),el=id=>root.querySelector('#'+id);let C=DATA.components;
 const state={scenario:'chat',mode:'current',node:2,stage:'first',group:0,cacheModel:DATA.defaultModel.startsWith('claude')?'claude':'gpt'};let sequence=0;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const current=()=>DATA.scenarios.find(s=>s.id===state.scenario)||DATA.scenarios[0],active=()=>current().nodes[state.node];
 const blocks=mode=>DATA.plans[mode]||DATA.plans.chat,byKey=(mode,key)=>blocks(mode).find(id=>C[id].key===key);let mainId=byKey('chat','career_main');
 const shortTitles={scheduled_work:'예약된 작업 수행 지침',career_main:'career_main · 기본 지침',visible_actions_guide:'홈의 다음 행동 관리',career_chat_display:'채팅 답변 작성',chat_core:'chat_core · 별도 기본 지침',background_execution:'백그라운드 작업 지침',autonomous_career_work:'검색·추천 작업 지침',profile_context:'프로필·이력서',future_matching_insights:'사용자 정보·희망 조건',visible_actions:'홈에 표시된 다음 행동',capability_catalog:'불러올 수 있는 도구 목록',gmail_capability:'Gmail 연결 상태',dynamic_state:'현재 상황·이번 실행 목적',handbook_catalog:'업무 지침 목록',tool_policy:'도구 사용 지침',email_output_contract:'이메일 답변 작성',email_thread_context:'받은 메일·앞선 답장',core_response_guidance:'온보딩 답변 작성',onboarding_rules:'온보딩 진행',post_onboarding_voice_response_guidance:'통화 중 답변 작성',voice_call_rules:'통화 도구·종료 방법',career_coaching_activity:'진행 중인 코칭'};
 const fixedTitles={event:'이번에 일어난 일·맡긴 목적',history:'최근 대화·이전 요약',results:'도구 호출·실제 결과',link:'공고 ID·추천 ID·정확한 링크',tools_core:'기본 도구',loaders:'도구·지침 불러오기',tools_voice:'통화에서 쓸 수 있는 도구',tools_chat:'채팅에서 쓸 수 있는 도구','h:proactive_career':'먼저 챙길 일 판단','p:voice_back':'통화 판단 모델의 지침','p:voice_front':'듣고 말하는 모델의 지침','p:voice_front_onboarding':'온보딩 음성 모델의 지침'};
 const label=id=>fixedTitles[id]||shortTitles[C[id]?.key]||C[id]?.title||id;
 const typeInfo=id=>DATA.inputTypes[C[id]?.inputType]||DATA.inputTypes.mixed;
 function button(id,{included,block=true,tile=false}={}){const c=C[id];if(!c)return '';const type=typeInfo(id);return `<button class="btn${block?' btn-block':''} viz-tile input-fill" type="button" data-input-type="${esc(c.inputType)}" data-component="${esc(id)}" data-tooltip="${esc(type.label+' · '+c.summary)}"${included===undefined?'':` aria-pressed="${included}"`}><span class="input-content"><span>${esc(label(id))}</span><span class="input-kind text-small">${esc(type.label)}</span></span></button>`;}
 function contentKinds(c){return `${c.fixedPart?`<div class="kind-note input-fill" data-input-type="conditional"><h3>고정된 내용</h3><p>${esc(c.fixedPart)}</p></div>`:''}${c.dataPart?`<div class="kind-note input-fill" data-input-type="data"><h3>실행 때 넣는 값</h3><p>${esc(c.dataPart)}</p></div>`:''}`;}
 function source(s){return s?`<div class="source text-small text-muted"><code>${esc(s)}</code></div>`:'';}
 function show(title,kind,html){el('map-dialog-title').textContent=title;el('map-dialog-kind').textContent=kind;el('map-dialog-kind').hidden=!kind;el('map-dialog-content').innerHTML=html;if(!el('map-dialog').open)el('map-dialog').showModal();el('map-dialog-content').scrollTop=0;}
 function save(){}
 function restore(v){const x=v?.privateContent;if(!x||x.layout!=='desktop-cache-models-v2'||(x.sequence||0)<sequence)return;sequence=x.sequence||0;if(DATA.scenarios.some(s=>s.id===x.scenario))state.scenario=x.scenario;if(['current','proposed'].includes(x.mode))state.mode=x.mode;state.node=current().nodes[x.node]?x.node:current().nodes.findIndex(n=>n.kind==='main');state.stage=['first','loaded','result'].includes(x.stage)?x.stage:'first';state.cacheModel=x.cacheModel==='claude'?'claude':'gpt';}
__CAREER_COMPOSE__
 function token(id){return C[id]?.key||id;}
 // GPT uses a flattened system message with no explicit cache options.
 // Claude preserves explicit system/tool breakpoints. Neither means a hit.
 const cacheExplanations={
  gpt:'Career GPT 경로는 system blocks를 한 문자열로 합치고, prompt_cache_key·prompt_cache_options·prompt_cache_breakpoint를 보내지 않습니다. OpenAI의 기본 implicit 캐시를 사용합니다. 회색은 캐시 후보이며 적중한 범위가 아닙니다. 프로필·Memory 끝에는 별도 경계가 없고, 현재 시각·상태까지 같은 system 메시지에 들어가므로 그것이 바뀌면 앞의 고정 지침만 별도로 재사용된다고 볼 수 없습니다. 대화·도구 결과는 이전의 적격 메시지 끝까지 전체 앞부분이 같아야 재사용할 수 있습니다. 실제 양은 usage의 cached_tokens·cache_write_tokens로 확인합니다.',
  claude:'Claude 네이티브 호출은 프로필 끝·Memory 끝과 도구 정의 끝에 cache_control을 지정합니다. 표시한 경계까지 전체 앞부분이 동일할 때 재사용하며, 실제 적중 여부는 실행 로그로 확인해야 합니다.'

  const nested=depth<3?(s.properties?paramRows(s,path+'.',depth+1):s.items?.properties?paramRows(s.items,path+'[].',depth+1):[]):[];return [row,...nested];});}
 function toolCard(id,{heading='h3'}={}){const f=schemaOf(id);if(!f)return `<pre><code>${esc(C[id]?.text)}</code></pre>`;const rows=paramRows(f.parameters);
  return `<div class="tool-card"><${heading}>${esc(f.name)}</${heading}><p class="prose">${esc(f.description||'')}</p>${rows.length?`<table class="params"><colgroup><col class="name"><col class="type"><col></colgroup><thead><tr><th>입력</th><th>형식</th><th>설명</th></tr></thead><tbody>${rows.join('')}</tbody></table>`:'<p class="text-small text-muted">입력 없음</p>'}<details><summary class="text-small">원본 schema · ${chars(C[id].text)}</summary><pre><code>${esc(C[id].text)}</code></pre></details></div>`;}
 function owners(id){return toolGroups().filter(g=>g.members.includes(id));}
 function renderCatalogDetail(){const id=state.catalogItem,box=el('catalog-detail');let html;
  if(id==='overview'){const cap=byKey('chat','capability_catalog'),book=byKey('chat','handbook_catalog');
   html=`<h2>능력·지침 목록</h2><p>도구 묶음과 업무 지침은 처음에 아래 목록으로만 보입니다. Career LLM이 load_capabilities나 load_handbook으로 불러오면 그때 도구 정의나 지침 본문이 입력에 추가됩니다. 왼쪽에서 항목을 고르면 추가되는 내용을 볼 수 있습니다.</p>${cap?`<h3>능력 목록 (capability_catalog)</h3><pre class="prose">${esc(C[cap].text)}</pre>`:''}${book?`<h3>업무 지침 목록 (handbook_catalog)</h3><pre class="prose">${esc(C[book].text)}</pre>`:''}`;}
  else if(id.startsWith('h:')){const c=C[id];html=`<h2>${esc(c.title)}</h2><div class="chips"><span class="chip">${esc(id.slice(2))}</span><span class="chip">${chars(c.text)}</span></div>${c.summary?`<div class="kind-note input-fill" data-input-type="conditional"><h3>목록에 보이는 한 줄</h3><p>${esc(c.summary)}</p></div>`:''}<h3>불러오면 추가되는 본문</h3><pre class="prose">${esc(c.text)}</pre><p class="text-small text-muted">${esc(c.source||'')}</p>`;}
  else if(id.startsWith('t:')){const own=owners(id);html=`${toolCard(id,{heading:'h2'})}${own.length?`<div class="spaced"><h3>들어 있는 묶음</h3><div class="chips">${own.map(g=>`<button type="button" class="chip" data-catalog-item="${esc(g.id)}">${esc(g.title)}</button>`).join('')}</div></div>`:''}<p class="text-small text-muted">${esc(C[id].source||'')}</p>`;}
  else{const g=toolGroups().find(x=>x.id===id);if(!g){box.innerHTML='';return;}const c=C[id];const total=g.members.reduce((n,m)=>n+String(C[m]?.text||'').length,0);
   html=`<h2>${esc(g.title)}</h2><div class="chips"><span class="chip">${esc(g.note)}</span><span class="chip">도구 ${g.members.length}개</span><span class="chip">schema ${total.toLocaleString('ko-KR')}자</span></div>${id.startsWith('c:')&&c?.summary?`<div class="kind-note input-fill" data-input-type="conditional"><h3>능력 목록에 보이는 한 줄</h3><p>${esc(c.summary)}</p></div>`:''}<h3>${id==='tools_core'?'처음부터 들어가는 도구':id.startsWith('c:')?'불러오면 추가되는 도구':'도구'}</h3>${g.members.map(m=>toolCard(m)).join('')}`;}
  box.innerHTML=`<div class="catalog-detail">${html}</div>`;box.scrollTop=0;}
 function renderView(){const catalog=state.view==='catalog';root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));
  root.querySelector('main.columns').hidden=catalog;el('catalog-view').hidden=!catalog;el('compare-toolbar').hidden=catalog;el('type-legend').hidden=catalog;root.style.gridTemplateRows=catalog?'auto minmax(0,1fr)':'';
  if(catalog){renderCatalogList();renderCatalogDetail();}}
 root.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){state.view=v.dataset.view;renderView();return;}
  const c=e.target.closest('[data-catalog-item]');if(c){state.catalogItem=c.dataset.catalogItem;renderCatalogList();renderCatalogDetail();}});
 el('catalog-search').addEventListener('input',e=>{state.catalogQuery=e.target.value;renderCatalogList();});
 // Every modal closes on a backdrop click.
 el('map-dialog').addEventListener('click',e=>{if(e.target!==el('map-dialog'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)el('map-dialog').close();});
 el('map-close').addEventListener('click',()=>el('map-dialog').close());el('scenario-detail').addEventListener('click',caseDetail);el('whole-input').addEventListener('click',whole);el('changes').addEventListener('click',changes);
 el('source-info').addEventListener('click',()=>show('출처',DATA.captured,`<p>현재 서버 코드: ${esc(DATA.revision)}</p><p>프롬프트·도구·업무 지침은 제품의 조립 함수와 현재 소스에서 읽습니다. 실제 고객 자료와 모델 호출은 사용하지 않습니다.</p><p>케이스 이름·설명·개선안은 기존 지도의 해설입니다. 실행 조건과 실제 경로는 연결된 현재 코드에서 확인합니다. 로컬 개발에서는 저장한 코드, 운영에서는 배포된 코드를 표시합니다.</p>${DATA.unavailable.length?`<h3>현재 소스 확인 불가</h3><p>${DATA.unavailable.map(esc).join(', ')}</p>`:''}`));
 el('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{el('desktop-link').click();}});
 document.addEventListener('fullscreenchange',()=>el('fullscreen').textContent=document.fullscreenElement?'전체화면 나가기':'전체화면');
 window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState;if(v?.privateContent?.layout==='desktop-cache-models-v2'&&v.privateContent.sequence>sequence){restore(v);render();}});
 el('type-legend').innerHTML=Object.entries(DATA.inputTypes).map(([type,info])=>`<span class="type-key" data-tooltip="${esc(info.description)}"><span aria-hidden="true" class="swatch input-fill" data-input-type="${type}"></span>${esc(info.label)}</span>`).join('')+`<span class="type-key" data-tooltip="${esc(cacheExplanation())}"><span aria-hidden="true" class="swatch cache-swatch"></span>회색 박스 · 캐시 후보 / 명시적 범위</span>`;
 el('call-controls').insertAdjacentHTML('afterend',`<div class="button-list" id="cache-controls" aria-label="캐시를 확인할 모델"><button class="btn" type="button" data-cache-model="gpt" aria-pressed="true">GPT · 기본 채팅 모델</button><button class="btn" type="button" data-cache-model="claude" aria-pressed="false">Claude</button><button class="btn btn-ghost" type="button" id="cache-detail">캐시 근거</button></div><p class="text-small" id="cache-note"></p>`);
 root.querySelector('[data-cache-model="gpt"]').textContent=DATA.defaultModel.startsWith('gpt')?'GPT · 기본 채팅 모델':'GPT';
 root.querySelector('[data-cache-model="claude"]').textContent=DATA.defaultModel.startsWith('claude')?'Claude · 기본 채팅 모델':'Claude';
 el('cache-detail').addEventListener('click',()=>show('캐시 동작',state.cacheModel==='gpt'?'GPT · 기본 모델 '+DATA.defaultModel:'Claude',`<p>${esc(cacheExplanation())}</p>${source(cacheSource())}<div class="button-list">${(state.cacheModel==='gpt'?['cache_gpt','cache_request']:['cache_claude','cache_tools']).map(id=>button(id,{block:false})).join('')}</div>${state.cacheModel==='gpt'?'<p><a href="https://developers.openai.com/api/docs/guides/prompt-caching" target="_blank" rel="noopener">OpenAI 공식 캐시 문서</a></p>':''}`));
 render();
 const initial=el('cases').querySelector('[data-scenario="'+state.scenario+'"]');if(initial)el('cases').scrollTop=Math.max(0,initial.offsetTop-el('cases').offsetTop-70);
 window.addEventListener('message',e=>{
  if(e.source!==parent||e.data?.type!=='career-map:update')return;
  DATA=e.data.manifest;C=DATA.components;mainId=byKey('chat','career_main');
  if(!current().nodes[state.node])state.node=current().nodes.findIndex(n=>n.kind!=='step');
  render();if(state.view==='catalog')renderView();
  if(el('map-dialog').open)el('map-dialog').close();
 });
 // Event delegation keeps tooltips working when the live manifest replaces rows.
 const tip=document.createElement('div');tip.className='map-tooltip';tip.hidden=true;tip.setAttribute('role','tooltip');tip.id='map-tooltip';document.body.append(tip);
 function hideTip(){tip.hidden=true;root.querySelector('[aria-describedby="map-tooltip"]')?.removeAttribute('aria-describedby');}
 function tooltip(e){const target=e.target.closest('[data-tooltip]');if(!target)return;tip.textContent=target.dataset.tooltip;tip.hidden=false;target.setAttribute('aria-describedby','map-tooltip');const r=target.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=Math.max(8,Math.min(r.bottom+6,innerHeight-tip.offsetHeight-8))+'px';}
 root.addEventListener('pointerover',tooltip);root.addEventListener('focusin',tooltip);root.addEventListener('pointerout',hideTip);root.addEventListener('focusout',hideTip);root.addEventListener('scroll',hideTip,true);root.addEventListener('click',hideTip);
 }
 function boot(e){if(e.source!==parent||e.data?.type!=='career-map:update')return;window.removeEventListener('message',boot);start(e.data.manifest);}
 window.addEventListener('message',boot);
 parent.postMessage({type:'career-map:ready'},'*');
})();
</script>
