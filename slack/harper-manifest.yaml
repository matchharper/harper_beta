_metadata:
  major_version: 1

display_information:
  name: Harper
  description: Harper recruiting agent for organization Slack channels
  background_color: "#111827"

features:
  rich_previews:
    is_active: true
    entity_types:
      - slack#/entities/item
  unfurl_domains:
    - matchharper.com
  bot_user:
    display_name: Harper
    always_online: true

oauth_config:
  redirect_urls:
    - https://matchharper.com/api/org/slack/callback
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:join
      - channels:manage
      - channels:read
      - chat:write
      - files:read
      - groups:history
      - groups:read
      - groups:write
      - links:read
      - links:write
      - users:read
      - users:read.email

settings:
  event_subscriptions:
    request_url: https://matchharper.com/api/internal/slack/events
    bot_events:
      - app_mention
      - app_uninstalled
      - entity_details_requested
      - link_shared
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    request_url: https://matchharper.com/api/internal/slack/interactivity
  incoming_webhooks:
    incoming_webhooks_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
