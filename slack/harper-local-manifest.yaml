_metadata:
  major_version: 1

display_information:
  name: Harper Local
  description: Local-only Harper candidate review development app
  background_color: "#111827"

features:
  rich_previews:
    is_active: true
    entity_types:
      - slack#/entities/item
  unfurl_domains:
    - matchharper.com
  bot_user:
    display_name: Harper Local
    always_online: true

oauth_config:
  scopes:
    bot:
      - channels:join
      - channels:manage
      - channels:read
      - channels:history
      - chat:write
      - groups:read
      - groups:write
      - app_mentions:read
      - links:read
      - links:write
      - users:read
      - users:read.email

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - entity_details_requested
      - link_shared
      - message.channels
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
