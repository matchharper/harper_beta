_metadata:
  major_version: 1

display_information:
  name: Harper Local
  description: Local-only Harper candidate review development app
  background_color: "#111827"

features:
  bot_user:
    display_name: Harper Local
    always_online: true

oauth_config:
  scopes:
    bot:
      - channels:join
      - channels:manage
      - channels:read
      - chat:write
      - groups:read
      - groups:write
      - users:read
      - users:read.email

settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
