# Temporary: runs the career/ops test suites on unmerged branches and on dev, and reports every failing test name,
# so the branches' failures can be compared with dev's existing ones. Delete this branch after reading the results.
name: claude-branch-tests
on:
  push:
    branches: [claude/ci-branch-tests]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ref:
          - dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tests
        run: |
          set +e
          # Files both #391 and #431 changed (browser tool, submission receipt) and their neighbours, on the merged dev.
          files=$(git ls-files 'src/lib/career/browser/*.test.ts' 'src/lib/career/work/*.test.ts' 'src/lib/shareLinks/*.test.ts' \
            'src/lib/career/forms/*.test.ts' 'src/lib/career/llm.concurrentPreparation.test.ts' 'src/lib/career/background/gmailReview.test.ts' \
            'src/app/api/talent/integrations/gmail/route.test.ts' 'src/lib/career/opportunityOffer.database.test.ts' \
            'src/components/career/BrowserSessionCard.test.tsx' 'src/components/career/chat/CareerInlineForms.test.tsx')
          node --import tsx --test --test-concurrency=4 --test-timeout=120000 --test-reporter=spec $files > out.txt 2>&1
          echo "::warning title=dev counts::$(grep -E '^ℹ (tests|pass|fail) ' out.txt | tr '\n' ' ')"
          grep -A30 '^✖ failing tests' out.txt > fail.txt || true
          split -C 3000 -d fail.txt part_
          for f in part_*; do echo "::warning title=dev ${f}::$(sed 's/%/%25/g; s/\r//g' $f | sed ':a;N;$!ba;s/\n/%0A/g')"; done
