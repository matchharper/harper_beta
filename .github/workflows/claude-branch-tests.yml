# Temporary: runs the career/ops test suites on unmerged branches and on dev, and reports every failing test name,
# so the branches' failures can be compared with dev's existing ones. Delete this branch after reading the results.
name: claude-branch-tests
on:
  push:
    branches: [claude/ci-branch-tests]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ref:
          - dev
          - claude/project-thread-rexj39
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tests
        run: |
          set +e
          for i in 1 2 3; do
            node --import tsx --test --test-timeout=120000 --test-reporter=spec src/lib/org/companyRoleBriefRevisionsMigration.test.ts > out.txt 2>&1
            echo "::warning title=${{ matrix.ref }} run $i::$(grep -E '^ℹ (tests|pass|fail) ' out.txt | tr '\n' ' ')"
          done
