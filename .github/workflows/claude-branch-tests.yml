# Temporary: runs single tests on unmerged apply branches and reports their full output as annotations.
# Lives only on this branch; delete the branch after reading the results.
name: claude-branch-tests
on:
  push:
    branches: [claude/ci-branch-tests]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: claude/apply-retry-unsubmitted
            file: src/lib/career/work/database.test.ts
          - ref: claude/apply-approve-all
            file: src/lib/career/llm.concurrentPreparation.test.ts
          - ref: claude/apply-form-required
            file: src/lib/career/llm.concurrentPreparation.test.ts
          - ref: claude/apply-link-from-form
            file: src/lib/career/llm.concurrentPreparation.test.ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: test
        run: |
          set +e
          timeout 5m node --import tsx --test --test-timeout=120000 --test-reporter=spec \
            "${{ matrix.file }}" > out.txt 2>&1
          echo "exit=$?"
          cat out.txt
          # Annotation messages are cut at 4 KB: send the output in numbered chunks, newlines kept.
          grep -E '^ℹ (tests|pass|fail) ' out.txt | tr '\n' ' ' | sed 's/^/::warning title=${{ matrix.ref }} counts::/'; echo
          grep -B2 -A25 '^✖ failing tests' out.txt > fail.txt || true
          split -C 3000 -d fail.txt part_
          for f in part_*; do echo "::warning title=${{ matrix.ref }} ${f}::$(sed 's/%/%25/g; s/\r//g' $f | sed ':a;N;$!ba;s/\n/%0A/g')"; done
